[package]
name = "app"
version = "2.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 生产构建必需：通过 tauri 自定义协议加载嵌入的 dist 前端资源。
# 缺失该 feature 时 release 二进制会回退加载 devUrl（localhost:1420），
# 在未运行 vite dev server 时表现为"无法访问此页面"。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-notification = "2"

# reqwest 默认 default-tls（native-tls → openssl-sys），在 Android 交叉编译时
# openssl-sys 无法找到 OpenSSL 导致构建失败。Android 平台改用纯 Rust 的
# rustls（内置 webpki 根证书），桌面端维持默认 schannel/openssl 行为不变。
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 桌面专属依赖：tauri-plugin-global-shortcut / tauri-plugin-autostart 的 crate
# 顶部带 `#![cfg(not(any(target_os = "android", target_os = "ios")))]`，在 Android 上
# 整个 crate 不编译（无法引用）；tray-icon feature 同理仅桌面有意义。
# 因此全部按 target 条件化，Android 构建完全不引入这些 crate，桌面构建行为不变。
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
